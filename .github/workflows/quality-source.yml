name: quality-source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canvillage-quality-source
  cancel-in-progress: true

jobs:
  source:
    if: github.repository == 'mengxiangshu666/Canvillage'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VILLAGE_CANVAS_CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked Python dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="${HOME}/.local/bin:${PATH}"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          uv lock --check
          uv sync --frozen --group dev
      - name: Source and release checks
        run: |
          uv run ruff check .
          uv run python scripts/check_product_identity.py
          uv run pytest -q tests/test_public_source_export.py tests/test_village_canvas_aigc_bundle.py tests/test_product_independence.py tests/test_p0b_compliance_generator.py tests/compliance/test_generate_p0b_artifacts.py tests/test_chat_service_canvas_preflight.py tests/test_runtime_source_path.py tests/test_shared_context.py tests/test_stage_asset_scene_360_provider.py
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
          run_install: false
      - name: Frontend typecheck and build
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend run build:supercanvas
      - name: Scan full source history for secrets
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -Eeuo pipefail
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          curl -sSfL --retry 4 "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}/gitleaks" gitleaks
          "${RUNNER_TEMP}/gitleaks/gitleaks" git . -c .gitleaks.toml --redact --no-banner
      - name: Verify clean source checkout
        run: |
          git diff --check
          git diff --exit-code
